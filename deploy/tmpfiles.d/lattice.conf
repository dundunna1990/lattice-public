# Runtime directories for Lattice daemons.
# Created at boot by systemd-tmpfiles.
d /var/lib/lattice        0750 lattice lattice -
d /var/lib/lattice/tokens 0700 lattice lattice -
d /var/lib/lattice/keys   0700 lattice lattice -
d /var/lib/lattice-root   0700 root root -
d /var/log/lattice        0750 lattice lattice -
d /run/lattice            0755 lattice lattice -
d /mnt/lattice            0755 root root -
d /run/lattice-operator   2770 lattice lattice-operator -
